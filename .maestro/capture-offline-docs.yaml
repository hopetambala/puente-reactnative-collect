# Puente Collect — screenshots for the public guide at
# https://puente-dr.github.io/guides/collecting-without-a-signal/
#
# CAPTURE ONLY. It asserts just enough to be sure each screenshot shows the
# state it claims to — a screenshot of the wrong screen is worse than none,
# because nobody re-checks a picture. Anything needing a real assertion belongs
# in one of the offline-*.yaml flows.
#
# THE SCREENSHOT RULE
# Every person and organization in a published image must be invented. The
# resident created here is "Ejemplo Ramirez", who does not exist. Do not swap in
# a real name, and do not run this against a backend and then publish a shot
# containing a real partner organization — staging was seeded with production
# organization names on 2026-09-08 and is no longer safe for that.
#
# BOTH LANGUAGES
# Every text selector matches English OR Spanish — Collect renders in the DEVICE
# language, Maestro matches text as a REGEX, and a flow-file `env:` default
# OVERRIDES `-e` in this version of Maestro (verified), so an alternation is
# both simpler and safer than a variable. Only the output directory varies.
#
# Run:
#   yarn start:staging-clear                  # Metro FIRST
#   ./.maestro/capture-guide-docs.sh both     # both languages
#
#   # or one language, by hand:
#   yarn maestro .maestro/capture-offline-docs.yaml                 # English
#   yarn maestro .maestro/capture-offline-docs.yaml \
#     -e OUT=docs/img/offline/es                                    # on an es device
appId: io.ionic.starter1270348
---
# Screenshot destination. `OUT` is left UNSET by default on purpose: an unset
# Maestro variable arrives as its own name, hence the guard.
- evalScript: "${output.dir = (typeof OUT === 'undefined' || OUT === '' || OUT === 'OUT') ? 'docs/img/offline' : OUT}"

- launchApp
- runFlow: subflows/login.yaml

# ─── START FROM AN EMPTY QUEUE ─────────────────────────────────────────────
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-offline"
      EXPECT: "Offline Sync|Sincronización sin conexión"
- runFlow:
    file: subflows/set-offline-mode.yaml
    env:
      STATE: "OFF"
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-offline"
      EXPECT: "Offline Sync|Sincronización sin conexión"
- extendedWaitUntil:
    visible: "Retry|Reintentar|No forms queued.*|No hay formularios en cola.*"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "offline-retry-button"
    commands:
      - tapOn:
          id: "offline-retry-button"
      - extendedWaitUntil:
          notVisible:
            id: "offline-retry-button"
          timeout: 60000

# ── 4. the empty state (captured first, while the queue is genuinely empty) ──
- assertVisible: "No forms queued. You are all caught up!|No hay formularios en cola. ¡Estás al día!"
- takeScreenshot: ${output.dir}/collect-04-all-caught-up

# ─── GO OFFLINE AND OPEN A FORM ────────────────────────────────────────────
- runFlow:
    file: subflows/set-offline-mode.yaml
    env:
      STATE: "ON"
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-data-collection"
      EXPECT: "Puente Forms|Formularios Puente"
- tapOn: "Resident ID|Identificación de residente"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "OK|Aceptar"
    commands:
      - tapOn: "OK|Aceptar"
      - waitForAnimationToEnd
- runFlow: subflows/give-consent.yaml
- extendedWaitUntil:
    visible: "First Name|Primer Nombre"
    timeout: 20000

# ── 1. the offline banner, on a form the surveyor is actually filling in ──
- assertVisible: ".*offline.*|.*sin conexión.*"
- takeScreenshot: ${output.dir}/collect-01-offline-banner

# ─── QUEUE ONE FORM ────────────────────────────────────────────────────────
- tapOn: "First Name|Primer Nombre"
- inputText: "Ejemplo"
- tapOn: "Last Name|Apellido"
- inputText: "Ramirez"
- waitForAnimationToEnd
- tapOn: "Demographics|Demografía"
- waitForAnimationToEnd
- scroll
- tapOn: "Female|Femenino"
- waitForAnimationToEnd
- tapOn: "Single|Soltero/a"
- waitForAnimationToEnd
- scroll
- tapOn: "Highschool|Termino la escuela secundaria"
- waitForAnimationToEnd
- scroll
- scroll
- scroll
- tapOn:
    id: "formSubmit"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Household Manager|Administrador del hogar"
    commands:
      - tapOn: "<"
      - waitForAnimationToEnd

# ── 2. the confirmation that it was saved, not sent ──
# Best-effort: this is a native alert and can be dismissed by the time we look.
# The queue shot below is the one the guide actually needs, so a miss here must
# not abort the run.
- runFlow:
    when:
      visible: "Saved offline.*|Guardado sin conexión.*"
    commands:
      - takeScreenshot: ${output.dir}/collect-02-saved-offline
- runFlow:
    when:
      visible: "OK|Aceptar"
    commands:
      - tapOn: "OK|Aceptar"
      - waitForAnimationToEnd

# ── 3. the queue, listing WHICH form and about whom ──
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-offline"
      EXPECT: "Offline Sync|Sincronización sin conexión"
- extendedWaitUntil:
    visible: "Waiting to sync|Esperando sincronización"
    timeout: 20000
- takeScreenshot: ${output.dir}/collect-03-queue

# ── 5. the discard confirmation, which is permanent ──
- tapOn: "Discard|Descartar"
- extendedWaitUntil:
    visible: 'Discard this form\?|¿Descartar este formulario\?'
    timeout: 10000
- takeScreenshot: ${output.dir}/collect-05-discard-confirm

# Leave the device as we found it: confirm, so the invented record does not
# linger in a queue someone later syncs.
- tapOn: "Discard permanently|Descartar permanentemente"
- extendedWaitUntil:
    visible: "No forms queued.*|No hay formularios en cola.*"
    timeout: 20000
- runFlow:
    file: subflows/set-offline-mode.yaml
    env:
      STATE: "OFF"
