# Puente Collect — authenticated smoke test across all five bottom tabs.
#
# This is the release-gate smoke flow (see CLAUDE.md, "The release gate"). It
# signs in and visits every tab, asserting on arrival each time.
#
# Prerequisites:
#   1. Metro running in the environment under test:
#        yarn start:prod-clear      # or start:staging-clear
#   2. The simulator has the build under test:
#        xcrun simctl listapps <device-udid> | grep io.ionic.starter1270348
#
# Run:
#   yarn maestro .maestro/authenticated.yaml
appId: io.ionic.starter1270348
---
# Launch WITHOUT clearing state — clearing re-triggers the Terms modal and
# drops the session token.
- launchApp

- runFlow: subflows/login.yaml
- takeScreenshot: .claude/screenshots/04-home

# --- Data Collection ---
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-data-collection"
      EXPECT: "Puente Forms"
- takeScreenshot: .claude/screenshots/05-data-collection

# --- Find Records ---
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-find-records"
      EXPECT: "Search Individual"
- takeScreenshot: .claude/screenshots/06-find-records

# --- Offline Sync ---
# This tab was previously tapped at "70%, 94%" and screenshotted as
# "07-assets.png". It is the Offline tab and always was; there is no Assets tab
# in the bottom navigator. The filename is corrected here along with the
# selector, so the screenshot and the screen finally agree.
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-offline"
      EXPECT: "Offline Sync"
- takeScreenshot: .claude/screenshots/07-offline-sync

# --- Settings ---
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-settings"
      EXPECT: "Name, Phone, Email"
- takeScreenshot: .claude/screenshots/08-settings

# --- Back to Home, to prove the tab bar still works after the full sweep ---
- runFlow:
    file: subflows/open-tab.yaml
    env:
      TAB_ID: "tab-home"
      EXPECT: "Home"
