# Puente Collect — signup organization picker.
#
# WHY THIS EXISTS
# The Organization field on Sign Up rendered as a bare text box from January
# 2022 until 2026: it is an Autofill autocomplete that falls back to a plain
# TextInput when its list is empty, and the list was always empty
# (cacheAutofillData returned the enclosing function instead of the array, and
# JSON.stringify then dropped the function-valued property).
#
# It survived four and a half years partly because NOTHING TESTED IT — no test
# referenced AutoFill, and .maestro had no registration flow. This is that flow.
#
# WHAT TO LOOK FOR
#   signup-org-01-empty       the field before typing
#   signup-org-02-suggestions the open list. Rows must be a real touch target,
#                             not a ~29px strip, and must not be clipped.
#   signup-org-03-selected    the field AFTER tapping a suggestion. This is the
#                             assertion that matters: tapping a visible row must
#                             actually fill the field.
# REQUIRES A BACKEND WITH ORGANISATION DATA. Staging had none until 2026-09-08
# — the Organization class was empty while production held 59 rows — so this
# flow could not pass there. Staging is now seeded from production, and it does.
#
# The suggestions come from `loadSelectableOrganizations()`, which queries the
# Parse `Organization` class directly (NOT the autofill cache — that derives
# from _User strings and is only populated after login, so it is empty at the
# moment signup needs it).
#
# If it fails again, the first thing to check is the backend, NOT AutoFill. With
# no options the field degrades to free text by design — that is the documented
# fallback working, not the 2022 autofill bug returning:
#
#   GET <parseServerUrl>/classes/Organization?limit=1000&keys=name,active
#
# Deploying Cloud Code does not deploy DATA: staging gained
# organization.definer.js on 2026-09-04 and still had 0 rows until it was
# seeded separately. Passes against staging and prod alike.
appId: io.ionic.starter1270348
---
- launchApp:
    clearState: false
- tapOn: "Sign Up!"
- assertVisible: "Organization"
- takeScreenshot: .claude/screenshots/signup-org-01-empty
- tapOn: "Organization"
- inputText: "Pu"
- assertVisible: "Puente"
- takeScreenshot: .claude/screenshots/signup-org-02-suggestions
# The whole point: a suggestion that is visible must be selectable.
- tapOn: "Puente"
- takeScreenshot: .claude/screenshots/signup-org-03-selected
