# Sign in, and prove we arrived.
#
# WHY THIS FILE EXISTS
# This preamble was copy-pasted into 9 flows. Each copy typed into the username
# field by tapping the point "50%, 38%" — a hardcoded fraction of a 393x852
# screen — because the floating label makes the field ambiguous to a text
# selector. Nine copies meant a sign-in layout change was nine edits, and a
# coordinate that drifted failed silently: a tap on empty space is not an error,
# so the flow sailed on and failed later somewhere unrelated.
#
# The fields now carry stable testIDs (domains/Auth/SignIn/index.js), so this
# targets them by id. An id that stops existing fails HERE, on the line that
# names it.
#
# Params (both optional):
#   ALREADY_SIGNED_IN_OK — "true" to no-op when a session is already live.
#
# Requires: -e PARSE_USERNAME=... -e PARSE_PASSWORD=...
# The `maestro` yarn script already passes both.
appId: io.ionic.starter1270348
---
# READINESS GATE — must come before any `when:` guard.
#
# `runFlow: when: visible:` does not wait. It samples the screen once and skips
# if the thing is not there yet. On a cold `clearState` launch the dev client is
# still pulling the JS bundle from Metro, so the screen is empty, BOTH guards
# below skip, and the flow sails on to fail at the post-condition with
# "Last 7 Days is not visible" — pointing at Home, which was never the problem.
# Seen doing exactly that in offline-multiple-forms on 2026-09-03.
#
# Maestro matches text selectors as regexes, so this waits for whichever of the
# three possible first screens actually turns up: onboarding, sign-in, or an
# already-authenticated Home.
- extendedWaitUntil:
    visible: "Skip|Log-In|Last 7 Days"
    timeout: 60000

# extendedWaitUntil returns the moment the element joins the accessibility tree,
# which is BEFORE its entrance animation finishes. Tapping in that window throws
# kAXErrorInvalidUIElement inside the XCTest driver — a hard crash, not a retry.
# Seen killing the run at `Tap on "Skip"` on 2026-09-03.
- waitForAnimationToEnd

# Onboarding carousel on a fresh install.
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd

# Only sign in if we are actually on the sign-in screen. A flow that ran before
# this one may have left a live session.
- runFlow:
    when:
      visible: "Log-In"
    commands:
      # Precondition: the sign-in form is really up, not a splash that happens
      # to contain the words.
      - assertVisible:
          id: "signin-username"
      - tapOn:
          id: "signin-username"
      - inputText: ${PARSE_USERNAME}
      # Make the password field PLAIN TEXT before typing into it.
      #
      # Typing into an iOS secure field crashes Maestro's XCUITest driver --
      # "CommandFailed: Failed to connect to /127.0.0.1:<port>", then
      # "Restarting after unexpected exit, crash, or test timeout". The flow
      # dies mid-subflow with no assertion failure, which reads like an app
      # bug rather than a driver crash.
      #
      # This went unnoticed for a long time because the whole suite ran against
      # an already-authenticated device, so this block was SKIPPED every time.
      # visual-qa.yaml launches with `clearState: true`, so the moment it runs,
      # every later flow needs a real sign-in and the suite cannot recover.
      # Found 2026-09-11.
      - tapOn:
          id: "signin-password-visibility"
      - waitForAnimationToEnd
      - tapOn:
          id: "signin-password"
      - inputText: ${PARSE_PASSWORD}
      # Scroll the submit button clear of the keyboard before pressing it.
      #
      # Do NOT "dismiss the keyboard" by tapping the static text above the
      # button: "Don't have an account?" sits immediately above the Terms &
      # Conditions button (SignIn/index.js:331-340), and the tap lands on THAT,
      # opening a modal with `dismissable={false}` whose only exit is an Ok
      # button at the bottom of a ~3600px ScrollView the driver cannot scroll.
      # The run then fails the post-condition below, which reads like bad
      # credentials. Cost an hour on 2026-09-11.
      - scroll
      - tapOn:
          id: "signin-submit"

# Terms and Service / Privacy Policy gate. It is shown AFTER a successful
# sign-in to an account that has not accepted it yet -- NOT on launch, and not
# on the sign-in screen (verified 2026-09-11: a plain launch never shows it).
# It renders over everything, so the post-condition below fails while the modal
# sits on top, which reads like bad credentials rather than an ungated modal.
#
# Only reachable on a cleared install, which is why it stayed hidden for so
# long: the suite ran against an already-authenticated device until
# visual-qa.yaml (clearState: true) forced a real sign-in.
#
# `^Ok$` is anchored because a bare "Ok" also matches alert buttons elsewhere.
- runFlow:
    when:
      visible: "Terms and Service"
    commands:
      - scrollUntilVisible:
          element:
            text: "^Ok$"
          direction: DOWN
          timeout: 20000
      - tapOn: "^Ok$"
      - waitForAnimationToEnd

- runFlow: dismiss-coachmarks.yaml

# POST-CONDITION: authentication actually succeeded and the Home tab rendered.
# Without this a wrong password lands back on the sign-in screen and every
# later step taps into a form it cannot see.
#
# "Last 7 Days" rather than "Home": the word Home is the Home tab's own
# accessibilityLabel AND the screen heading, so it proves less than it looks
# like it does. The segmented control is unique to this screen and renders as
# soon as `user` is set, before the async stats land.
- extendedWaitUntil:
    visible: "Last 7 Days"
    timeout: 30000
- waitForAnimationToEnd
