# The GDPR consent gate that every data-collection form opens with.
#
# WHY THIS FILE EXISTS
# This pair of taps was written as coordinates in eight places — the checkbox at
# "10%, 71%" ("10%, 66%" online, because the offline banner shifts layout ~5%)
# and "Continue to Form" at "50%, 79%". The comments left behind show the cost:
# bounds derived by trial and error, e.g. "(10%, 68%) -> empty space below View
# Full Policy" and "(10%, 75%) -> hit Continue to Form top edge (mustConsent
# alert fired)", plus a guard to dismiss that alert "if the checkbox tap was
# slightly off" — an admission the tap missed often enough to need papering over.
#
# The old coordinate fallback failed on the fresh iOS quality gate: the policy
# copy changed the layout, so it tapped Continue without checking consent.
# Require the accessible, localized checkbox ID instead. If the screen is
# missing from the native accessibility tree, fail here rather than concealing
# the defect with pixels. Unit semantics are not proof of native exposure;
# this membership gate and the final destination must pass on both platforms.
appId: "${maestro.platform == 'android' ? 'puente.collect' : 'io.ionic.starter1270348'}"
---
- extendedWaitUntil:
    visible:
      id: "gdpr-consent-row"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "gdpr-consent-row"
- waitForAnimationToEnd
- assertVisible:
    id: "gdpr-continue-button"
- tapOn:
    id: "gdpr-continue-button"
- waitForAnimationToEnd

# Identification forms open their name fields; supplementary forms open the
# resident search input instead. The consent gate has neither destination.
- extendedWaitUntil:
    visible: "First Name|Nombre|Search by name or ID|Buscar por nombre o ID"
    timeout: 20000
