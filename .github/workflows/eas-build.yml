name: EAS Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # eas-cli@latest pulls @oclif/plugin-autocomplete, which requires
          # Node >= 22. On 20.x yarn aborts with "Found incompatible module"
          # before the CLI installs, so the build never reaches the signing step.
          node-version: '22.x'
          cache: 'yarn'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # environment.js is gitignored, so EAS checks out a tree without it and the
      # JS bundle phase dies with:
      #   Unable to resolve module ../../../environment from services/parse/auth/index.js
      # That is why every EAS Build has failed. preview.yaml already does this;
      # this workflow never did.
      #
      # DELIBERATELY uses PROD_-prefixed secrets rather than the PARSE_APP_ID /
      # PARSE_JAVASCRIPT_KEY that preview.yaml uses: those sit alongside
      # TEST_MODE: true and puente-test-logs, so they are the test app. Pointing
      # a TestFlight build at staging would have surveyors collecting into the
      # wrong database, which is worse than not shipping.
      - name: Require production Parse credentials
        run: |
          if [ -z "${{ secrets.PROD_PARSE_APP_ID }}" ] || [ -z "${{ secrets.PROD_PARSE_JAVASCRIPT_KEY }}" ]; then
            echo "::error::PROD_PARSE_APP_ID and PROD_PARSE_JAVASCRIPT_KEY must be set."
            echo "::error::The production app id starts with vBdTHqQU31. Do NOT reuse"
            echo "::error::PARSE_APP_ID — that is the test app used by preview.yaml."
            exit 1
          fi

      - name: Create environment.js for the release build
        run: |
          cat > environment.js <<'ENVEOF'
          const selectedEnv = {
            TEST_MODE: false,
            parseAppId: '${{ secrets.PROD_PARSE_APP_ID }}',
            parseJavascriptKey: '${{ secrets.PROD_PARSE_JAVASCRIPT_KEY }}',
            parseServerUrl: 'https://parseapi.back4app.com/',
            AWS_LAMBDA_URL: '${{ secrets.AWS_LAMBDA_URL }}',
            cloudWatchLogging: {
              logGroupName: 'puente-prod-logs',
              logStreamName: 'prod-log-stream',
              accessKeyId: '${{ secrets.AWS_CLOUDWATCH_ACCESSKEY_ID }}',
              secretAccessKey: '${{ secrets.AWS_CLOUDWATCH_SECRET_ACCESS_KEY }}',
              region: 'us-east-1'
            }
          };
          export default selectedEnv;
          ENVEOF

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build on EAS
        # Apple credentials are passed here for the same reason eas-submit.yml
        # passes them: without an Apple session EAS cannot regenerate expired
        # signing assets, and `--non-interactive` then fails rather than
        # prompting. Every EAS Build run since 2026-03 has died on exactly that:
        #
        #   Provisioning Profile has expired.
        #   Failed to update provisioning profile (L9KF7F3JF2) with distribution
        #   certificate (NULJX2P65L)
        #   No certificate exists with serial number "76B0ABCD…"
        #
        # The certificate EAS referenced no longer exists in the Apple account,
        # so it has to be able to mint a new one.
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_EMAIL_ADDRESS }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: eas build --platform all --non-interactive